<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <!-- Write domain box -->
  <rect x="20" y="20" width="330" height="520" rx="10" fill="#eef4ff" stroke="#5b7fd4" stroke-width="1.5"/>
  <text x="35" y="45" font-size="15" font-weight="bold" fill="#2b4a8a">Write Clock Domain (wr_clk)</text>

  <!-- Read domain box -->
  <rect x="630" y="20" width="330" height="520" rx="10" fill="#fff3ec" stroke="#d4895b" stroke-width="1.5"/>
  <text x="645" y="45" font-size="15" font-weight="bold" fill="#8a4a2b">Read Clock Domain (rd_clk)</text>

  <!-- Shared/async middle box -->
  <rect x="360" y="20" width="260" height="520" rx="10" fill="#f5f5f5" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="405" y="45" font-size="13" font-weight="bold" fill="#555">Async / Shared</text>

  <!-- Write pointer logic -->
  <rect x="45" y="90" width="280" height="70" rx="6" fill="#ffffff" stroke="#5b7fd4" stroke-width="1.5"/>
  <text x="185" y="115" font-size="13" text-anchor="middle" font-weight="bold">Write Pointer / Full Logic</text>
  <text x="185" y="135" font-size="11" text-anchor="middle" fill="#555">binary + gray counter, full flag</text>

  <!-- din/wr_en inputs -->
  <text x="45" y="200" font-size="12" fill="#333">din[N-1:0]  →</text>
  <text x="45" y="220" font-size="12" fill="#333">wr_en       →</text>
  <text x="45" y="240" font-size="12" fill="#333">wr_rst      →</text>

  <!-- full output -->
  <rect x="45" y="270" width="120" height="34" rx="5" fill="#ffe8e0" stroke="#c05a3a"/>
  <text x="105" y="292" font-size="12" text-anchor="middle" font-weight="bold">full</text>

  <!-- Dual port RAM -->
  <rect x="360" y="90" width="260" height="120" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  <text x="490" y="120" font-size="13" text-anchor="middle" font-weight="bold">Dual-Port RAM</text>
  <text x="490" y="140" font-size="11" text-anchor="middle" fill="#555">wr_clk / wr_addr / wr_data (port A)</text>
  <text x="490" y="158" font-size="11" text-anchor="middle" fill="#555">rd_clk / rd_addr / rd_data (port B)</text>
  <text x="490" y="185" font-size="11" text-anchor="middle" fill="#777">(true dual-port, one clock per side)</text>

  <!-- wr->rd synchronizer -->
  <rect x="380" y="250" width="220" height="90" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  <text x="490" y="272" font-size="12" text-anchor="middle" font-weight="bold">2-FF Synchronizer</text>
  <text x="490" y="290" font-size="11" text-anchor="middle" fill="#555">wr_ptr_gray → rd_clk domain</text>
  <rect x="400" y="298" width="60" height="24" rx="3" fill="#eef4ff" stroke="#5b7fd4"/>
  <text x="430" y="314" font-size="9" text-anchor="middle">FF1</text>
  <rect x="470" y="298" width="60" height="24" rx="3" fill="#eef4ff" stroke="#5b7fd4"/>
  <text x="500" y="314" font-size="9" text-anchor="middle">FF2</text>

  <!-- rd->wr synchronizer -->
  <rect x="380" y="360" width="220" height="90" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  <text x="490" y="382" font-size="12" text-anchor="middle" font-weight="bold">2-FF Synchronizer</text>
  <text x="490" y="400" font-size="11" text-anchor="middle" fill="#555">rd_ptr_gray → wr_clk domain</text>
  <rect x="400" y="408" width="60" height="24" rx="3" fill="#fff3ec" stroke="#d4895b"/>
  <text x="430" y="424" font-size="9" text-anchor="middle">FF1</text>
  <rect x="470" y="408" width="60" height="24" rx="3" fill="#fff3ec" stroke="#d4895b"/>
  <text x="500" y="424" font-size="9" text-anchor="middle">FF2</text>

  <!-- Read pointer logic -->
  <rect x="655" y="90" width="280" height="70" rx="6" fill="#ffffff" stroke="#d4895b" stroke-width="1.5"/>
  <text x="795" y="115" font-size="13" text-anchor="middle" font-weight="bold">Read Pointer / Empty Logic</text>
  <text x="795" y="135" font-size="11" text-anchor="middle" fill="#555">binary + gray counter, empty flag</text>

  <!-- dout/rd_en -->
  <text x="820" y="200" font-size="12" fill="#333">← dout[N-1:0]</text>
  <text x="820" y="220" font-size="12" fill="#333">rd_en       →</text>
  <text x="820" y="240" font-size="12" fill="#333">rd_rst      →</text>

  <!-- empty output -->
  <rect x="815" y="270" width="120" height="34" rx="5" fill="#e0f0ff" stroke="#3a7ac0"/>
  <text x="875" y="292" font-size="12" text-anchor="middle" font-weight="bold">empty</text>

  <!-- Arrows: write logic -> RAM -->
  <path d="M325,120 L360,120" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- RAM -> read logic -->
  <path d="M620,140 L655,140" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- write ptr -> wr->rd sync -->
  <path d="M185,160 L185,295 L380,295" stroke="#5b7fd4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- wr->rd sync -> read logic (into rd_clk domain, affects empty) -->
  <path d="M600,295 L795,295 L795,160" stroke="#5b7fd4" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="3 2"/>
  <!-- read ptr -> rd->wr sync -->
  <path d="M795,160 L795,405 L600,405" stroke="#d4895b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- rd->wr sync -> write logic (affects full) -->
  <path d="M380,405 L185,405 L185,160" stroke="#d4895b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="3 2"/>
  <!-- write logic -> full flag -->
  <path d="M120,160 L105,160 L105,270" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- read logic -> empty flag -->
  <path d="M865,160 L875,160 L875,270" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- legend -->
  <text x="380" y="485" font-size="11" fill="#555">Solid = same-domain signal path</text>
  <text x="380" y="502" font-size="11" fill="#555">Dashed = crosses into the other clock domain (post-synchronizer)</text>
  <text x="380" y="530" font-size="12" font-weight="bold" fill="#333">Async FIFO — top-level block diagram</text>
</svg>
